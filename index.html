<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>الگوی منظم | ریاضی پایه اول</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- =========================
         صفحه شروع
    ========================== -->

    <section id="startScreen" class="screen active">

        <div class="start-card">

            <div class="teacher-card">
                <img
                    src="IMG_4332.jpeg"
                    class="teacher-photo"
                    alt="آموزگار"
                >
            </div>

            <h1>الگوی منظم</h1>

            <div class="welcome-text">

                <p>بچه‌های گلم 🌸</p>

                <p>
                    الگوخوانی خیلی مهم است.
                    <br>
                    پس اول الگو را بخوانید،
                    بعد ادامه‌اش بدهید.
                </p>

            </div>

            <div class="name-box">

                <label for="studentName">
                    نام زیبایت را وارد کن:
                </label>

                <input
                    id="studentName"
                    type="text"
                    maxlength="25"
                    placeholder="نام من..."
                    autocomplete="off"
                >

            </div>

            <button
                id="startBtn"
                class="main-btn"
            >
                شروع بازی 🚀
            </button>

        </div>

    </section>


    <!-- =========================
         صفحه بازی
    ========================== -->

    <section id="gameScreen" class="screen">

        <div class="top-bar">

            <button
                id="prevBtn"
                class="nav-btn"
            >
                ❮ قبلی
            </button>

            <div class="stage-counter">

                <span id="stageNumber">
                    مرحله ۱
                </span>

                <span id="scoreText">
                    امتیاز: ۰
                </span>

            </div>

            <button
                id="nextBtn"
                class="nav-btn"
            >
                بعدی ❯
            </button>

        </div>


        <div class="game-container">

            <div class="game-title">
                <span id="gameTitle">
                    الگوی منظم
                </span>
            </div>


            <div
                id="instruction"
                class="instruction"
            ></div>


            <!-- جدول اصلی -->
            <div
                id="mainArea"
                class="main-area"
            ></div>


            <!-- انتخاب رنگ / شکل -->
            <div
                id="paletteArea"
                class="palette-area"
            ></div>


            <!-- جدول رسم واحد الگو -->
            <div
                id="repeatSection"
                class="repeat-section"
            >

                <div class="repeat-title">
                    حالا یک بار الگوی تکرارشونده را اینجا رسم کن ✏️
                </div>

                <div id="repeatArea"></div>

            </div>


            <div
                id="message"
                class="message"
            ></div>


            <button
                id="checkBtn"
                class="check-btn"
            >
                بررسی پاسخ ✅
            </button>


            <img
                src="34A60F59-B219-495E-B6FA-E03A85E81C3B.png"
                class="game-signature"
                alt="امضا"
            >

        </div>

    </section>


    <!-- =========================
         صفحه پایان
    ========================== -->

    <section
        id="finishScreen"
        class="screen"
    >

        <div class="finish-card">

            <div class="trophy">
                🏆
            </div>

            <h1>
                آفرین قهرمان! 🌟
            </h1>

            <p id="finishMessage"></p>

            <div class="final-score">

                <span>
                    امتیاز نهایی
                </span>

                <strong id="finalScore">
                    ۰
                </strong>

            </div>

            <button
                id="restartBtn"
                class="main-btn"
            >
                دوباره بازی کن 🔄
            </button>

            <img
                src="34A60F59-B219-495E-B6FA-E03A85E81C3B.png"
                class="finish-signature"
                alt="امضا"
            >

        </div>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
