<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#7438c8">

  <title>الگوی منظم | ریاضی پایه اول</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="app">

  <!-- =========================
       صفحه اول
  ========================== -->

  <section id="cover" class="screen active">

    <div class="cover-card">

      <div class="cover-top">
        <span>🌈</span>
        <span>ریاضی پایه اول</span>
        <span>🌈</span>
      </div>

      <img
        class="teacher-photo"
        src="IMG_4332.jpeg"
        alt="آموزگار"
      >

      <h1>الگوی منظم</h1>

      <div class="subtitle">
        بازی کشف و ساخت الگو
      </div>

      <div class="cover-pattern">
        <span class="mini-circle blue"></span>
        <span class="mini-circle yellow"></span>
        <span class="mini-circle blue"></span>
        <span class="mini-circle yellow"></span>
      </div>

      <p class="cover-text">
        شکل‌ها را با دقت نگاه کن،
        <br>
        الگو را پیدا کن و بازی کن!
      </p>

      <button id="startBtn" class="primary-btn">
        شروع بازی 🎮
      </button>

    </div>

  </section>


  <!-- =========================
       صفحه بازی
  ========================== -->

  <section id="game" class="screen">

    <header class="game-header">

      <div class="game-title">
        🌸 الگوی منظم
      </div>

      <div class="stats">

        <span id="levelLabel">
          مرحله ۱
        </span>

        <span id="scoreLabel">
          امتیاز: ۰
        </span>

      </div>

    </header>


    <div class="progress">
      <div id="progressBar"></div>
    </div>


    <section class="question-card">

      <div id="typeBadge" class="type-badge">
        الگو را پیدا کن
      </div>

      <div
        id="questionText"
        class="question-text">
      </div>


      <div
        id="instruction"
        class="instruction">
      </div>


      <!-- الگو -->

      <div id="patternArea"></div>


      <!-- گزینه‌ها -->

      <div
        id="choicesTitle"
        class="choices-title hidden">
        شکل مناسب را انتخاب کن:
      </div>

      <div
        id="choices"
        class="choices">
      </div>


      <!-- پیام -->

      <div
        id="feedback"
        class="feedback"
        aria-live="polite">
      </div>

    </section>


    <div class="bottom-actions">

      <button
        id="checkBtn"
        class="primary-btn hidden">
        بررسی پاسخ ✓
      </button>

      <button
        id="nextBtn"
        class="secondary-btn hidden">
        مرحله بعد ←
      </button>

    </div>


    <!-- امضا فقط در صفحه دوم -->

    <div class="signature-box">

      <img
        class="small-signature"
        src="34A60F59-B219-495E-B6FA-E03A85E81C3B.png"
        alt="امضا">

    </div>

  </section>


  <!-- =========================
       صفحه پایان
  ========================== -->

  <section id="finish" class="screen">

    <div class="finish-card">

      <div class="finish-stars">
        🌟 🌸 🌟
      </div>

      <h1>
        آفرین!
      </h1>

      <p>
        تو الگوها را با دقت پیدا کردی.
      </p>

      <div
        id="finalScore"
        class="final-score">
      </div>

      <button
        id="restartBtn"
        class="primary-btn">
        دوباره بازی می‌کنم 🔄
      </button>

    </div>

  </section>

</main>


<script src="script.js"></script>

</body>
</html>
