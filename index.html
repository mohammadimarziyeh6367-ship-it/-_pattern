<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#7438c8">
  <title>الگوی منظم | ریاضی پایه اول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">

    <section id="startScreen" class="screen start-screen active">
      <div class="start-card">
        <div class="teacher-photo-wrap">
          <img id="teacherPhoto" src="IMG_4332.jpeg" alt="آموزگار">
        </div>

        <div class="start-title">الگوی منظم</div>
        <div class="start-subtitle">ریاضی پایه اول دبستان</div>

        <div class="name-box">
          <div class="flower">🌸</div>
          <label for="studentName">نام زیبایت را وارد کن</label>
          <input id="studentName" type="text" maxlength="24" autocomplete="off"
                 placeholder="نام من..." inputmode="text">
        </div>

        <button id="startBtn" class="main-btn" type="button">شروع بازی 🎮</button>
        <div class="tiny-hint">الگوها را پیدا کن و ادامه بده! 🌈</div>
      </div>
    </section>

    <section id="gameScreen" class="screen game-screen">
      <header class="topbar">
        <div class="top-title">الگوی منظم 🌈</div>
        <div class="student-pill">دانش‌آموز: <span id="playerName">دوست من</span></div>
      </header>

      <div class="game-head">
        <button id="homeBtn" class="small-btn" type="button">⌂ شروع</button>

        <div class="stage-info">
          <strong>مرحله <span id="levelNo">۱</span> از <span id="levelTotal">۱۳</span></strong>
          <div class="progress-track">
            <div id="progressBar"></div>
          </div>
        </div>

        <div class="score-pill">⭐ <span id="score">۰</span></div>
      </div>

      <div class="instruction-card">
        <div id="instruction">الگو را پیدا کن و ادامه بده.</div>
      </div>

      <div id="patternArea" class="pattern-area"></div>

      <div class="answer-title">حالا چه چیزی باید بیاید؟</div>
      <div id="answerArea" class="answer-area"></div>

      <div id="repeatUnit" class="repeat-unit hidden"></div>

      <div id="feedback" class="feedback" aria-live="polite"></div>

      <div class="controls">
        <button id="checkBtn" class="control-btn primary" type="button">بررسی پاسخ ✓</button>
        <button id="clearBtn" class="control-btn" type="button">پاک کردن</button>
        <button id="prevBtn" class="control-btn" type="button">← قبلی</button>
        <button id="nextBtn" class="control-btn" type="button">بعدی →</button>
      </div>

      <img class="signature"
           src="34A60F59-B219-495E-B6FA-E03A85E81C3B.png"
           alt="امضای آموزگار">
    </section>

    <section id="endScreen" class="screen end-screen">
      <div class="end-card">
        <div class="trophy">🏆</div>
        <h1>آفرین <span id="endName">دوست من</span>!</h1>
        <p>تو الگوها را با دقت پیدا کردی.</p>

        <div class="final-score">
          امتیاز تو: <strong id="finalScore">۰</strong> ⭐
        </div>

        <button id="restartBtn" class="main-btn" type="button">بازی دوباره 🔄</button>
        <button id="endHomeBtn" class="secondary-btn" type="button">بازگشت به صفحه اول</button>

        <img class="signature end-signature"
             src="34A60F59-B219-495E-B6FA-E03A85E81C3B.png"
             alt="امضای آموزگار">
      </div>
    </section>

  </main>

  <div id="confetti"></div>
  <script src="script.js"></script>
</body>
</html>
