<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ef">
  <title>الگوی منظم | ریاضی پایهٔ اول</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="app">

  <!-- صفحه شروع -->
  <section id="welcome" class="screen welcome">

    <div class="welcome-card">

      <img class="teacher-photo"
           src="IMG_4332.jpeg"
           alt="عکس آموزگار"
           onerror="this.hidden=true">

      <div class="welcome-title">الگوی منظم</div>

      <div class="welcome-subtitle">
        بازی ریاضی پایهٔ اول
      </div>

      <p class="welcome-message">
        بچه‌های گلم، با دقت به الگو نگاه کن و آن را ادامه بده.
      </p>

      <label for="studentName">نام دانش‌آموز:</label>

      <input
        id="studentName"
        type="text"
        maxlength="35"
        placeholder="نامت را اینجا بنویس"
        autocomplete="off">

      <button
        id="startButton"
        class="primary-button"
        type="button">
        شروع بازی
      </button>

    </div>

  </section>


  <!-- صفحه بازی -->
  <section id="game" class="screen game-screen hidden">

    <header class="game-header">

      <div class="game-brand">

        <span class="brand-icon" aria-hidden="true">🌈</span>

        <div>
          <strong>الگوی منظم</strong>
          <small id="studentGreeting">آماده‌ای؟</small>
        </div>

      </div>

      <div class="stage-counter" id="stageCounter">
        ۱ از ۸
      </div>

    </header>


    <div class="progress-track">
      <div id="progressBar"></div>
    </div>


    <section class="question-area">

      <h1 id="questionTitle">
        الگو را ادامه بده
      </h1>

      <p id="questionText"></p>

    </section>


    <!-- مدادهای رنگی -->

    <section class="palette-panel" aria-label="مدادهای رنگی">

      <p class="palette-caption">
        یک مداد رنگی انتخاب کن:
      </p>

      <div id="palette" class="palette"></div>

      <div class="tool-buttons">

        <button
          id="eraserButton"
          class="tool-button"
          type="button"
          aria-pressed="false">
          پاک‌کن
        </button>

        <button
          id="clearButton"
          class="tool-button"
          type="button">
          پاک‌کردن پاسخ‌های این صفحه
        </button>

      </div>

    </section>


    <!-- جدول اصلی و جدول تکرار -->

    <section id="boardArea" class="board-area">

      <div id="boardLabel" class="board-label">
        الگوی اصلی
      </div>

      <div class="board-wrap">
        <div id="mainBoard" class="board"></div>
      </div>


      <div id="copyLabel" class="board-label copy-label">
        یک بار الگوی تکرارشونده را در جدول خالی تکرار کن
      </div>

      <div class="board-wrap">
        <div id="copyBoard" class="board copy-board"></div>
      </div>

    </section>


    <div id="feedback" class="feedback" aria-live="polite"></div>


    <!-- دکمه‌های حرکت -->

    <nav class="nav-buttons" aria-label="حرکت بین مرحله‌ها">

      <button
        id="prevButton"
        class="nav-button"
        type="button">
        مرحلهٔ قبل
      </button>

      <button
        id="checkButton"
        class="primary-button"
        type="button">
        بررسی پاسخ
      </button>

      <button
        id="nextButton"
        class="nav-button"
        type="button">
        مرحلهٔ بعدی
      </button>

      <button
        id="exitButton"
        class="nav-button exit-button"
        type="button">
        خروج
      </button>

    </nav>


    <!-- امضای آموزگار -->

    <footer class="game-footer">

      <img
        class="signature"
        src="34A60F59-B219-495E-B6FA-E03A85E81C3B.png"
        alt="امضای مرضیه محمدی">

      <div>
        آموزگار: مرضیه محمدی |
        مدرسهٔ دخترانهٔ شریعتی
      </div>

    </footer>

  </section>


  <!-- صفحه پایان بازی -->

  <section id="finish" class="screen finish-screen hidden">

    <div class="finish-card">

      <div class="finish-star" aria-hidden="true">
        🌟
      </div>

      <h1>آفرین!</h1>

      <p id="finishMessage"></p>

      <img
        class="signature finish-signature"
        src="34A60F59-B219-495E-B6FA-E03A85E81C3B.png"
        alt="امضای مرضیه محمدی">

      <button
        id="restartButton"
        class="primary-button"
        type="button">
        شروع دوباره
      </button>

    </div>

  </section>

</main>


<!-- فشفشه‌های تشویقی -->

<canvas
  id="fireworksCanvas"
  class="fireworks-canvas"
  aria-hidden="true">
</canvas>


<script src="script.js"></script>

</body>
</html>
