<!doctype html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#7438c8"
  >

  <title>الگوی منظم | ریاضی پایه اول</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<main id="app">

  <!-- =========================
       صفحه شروع
  ========================== -->

  <section
    id="cover"
    class="screen active"
  >

    <div class="cover-card">

      <div class="cover-top">

        <span>🌈</span>

        <span>
          ریاضی پایه اول
        </span>

        <span>🌈</span>

      </div>


      <img
        class="teacher-photo"
        src="IMG_4332.jpeg"
        alt="آموزگار"
      >


      <h1>
        الگوی منظم
      </h1>


      <div class="subtitle">
        بازی کشف و ساخت الگو
      </div>


      <div class="cover-pattern">

        <span class="mini-circle blue"></span>

        <span class="mini-circle yellow"></span>

        <span class="mini-circle blue"></span>

        <span class="mini-circle yellow"></span>

      </div>


      <p class="cover-text">

        شکل‌ها را با دقت نگاه کن،
        <br>
        الگو را پیدا کن و بازی کن!

      </p>


      <!-- نام دانش آموز -->

      <div class="student-name-box">

        <label for="studentName">
          نام زیبایت را وارد کن:
        </label>

        <input
          id="studentName"
          type="text"
          inputmode="text"
          autocomplete="off"
          maxlength="30"
          placeholder="نام دانش‌آموز"
        >

      </div>


      <button
        id="startBtn"
        class="primary-btn"
      >
        شروع بازی 🎮
      </button>

    </div>

  </section>


  <!-- =========================
       صفحه بازی
  ========================== -->

  <section
    id="game"
    class="screen"
  >

    <header class="game-header">

      <div class="game-title">
        🌸 الگوی منظم
      </div>

      <div class="stats">

        <span id="levelLabel">
          مرحله ۱ از ۱۳
        </span>

        <span id="scoreLabel">
          امتیاز: ۰
        </span>

      </div>

    </header>


    <div class="progress">

      <div id="progressBar"></div>

    </div>


    <section class="question-card">

      <div
        id="typeBadge"
        class="type-badge"
      >
        جای خالی
      </div>


      <div
        id="questionText"
        class="question-text"
      ></div>


      <div
        id="instruction"
        class="instruction"
      ></div>


      <div
        id="patternArea"
      ></div>


      <div
        id="choicesTitle"
        class="choices-title hidden"
      >
        شکل مناسب را بکش و در جای خالی قرار بده:
      </div>


      <div
        id="choices"
        class="choices"
      ></div>


      <div
        id="feedback"
        class="feedback"
        aria-live="polite"
      ></div>

    </section>


    <!-- کنترل‌ها -->

    <nav
      class="bottom-actions"
      aria-label="کنترل مرحله"
    >

      <button
        id="exitBtn"
        class="control-btn exit-btn"
      >
        خروج
      </button>


      <button
        id="prevBtn"
        class="control-btn"
      >
        مرحله قبل
      </button>


      <button
        id="nextBtn"
        class="control-btn"
      >
        مرحله بعد
      </button>

    </nav>


    <!-- امضا -->

    <div class="signature-box">

      <img
        class="small-signature"
        src="34A60F59-B219-495E-B6FA-E03A85E81C3B.png"
        alt="امضا"
      >

    </div>

  </section>


  <!-- =========================
       پایان
  ========================== -->

  <section
    id="finish"
    class="screen"
  >

    <div class="finish-card">

      <div class="finish-stars">
        🌟 🌸 🌟
      </div>


      <h1>
        آفرین!
      </h1>


      <p id="finishMessage">
        تو الگوها را با دقت پیدا کردی.
      </p>


      <div
        id="finalScore"
        class="final-score"
      ></div>


      <button
        id="restartBtn"
        class="primary-btn"
      >
        دوباره بازی می‌کنم 🔄
      </button>

    </div>

  </section>

</main>


<script src="script.js"></script>

</body>

</html>
