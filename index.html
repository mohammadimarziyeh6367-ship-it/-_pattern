<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#7438c8">
    <title>الگوی منظم | ریاضی پایه اول</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<section id="startScreen" class="screen start-screen">
    <div class="start-card">
        <div class="stars">✦ ✧ ★ ✦ ✧</div>
        <h1>الگوی منظم</h1>
        <h2>ریاضی پایه اول دبستان</h2>
        <div class="teacher-photo-box">
            <img src="IMG_4332.jpeg"
                 alt="آموزگار مرضیه محمدی"
                 class="teacher-photo">
        </div>
        <div class="teacher-name">آموزگار: مرضیه محمدی</div>
    
        <p class="welcome">دلبندم، آماده‌ای الگوها را پیدا کنی؟ 🌈</p>
        <input id="studentName"
               type="text"
               placeholder="نام زیبایت را وارد کن"
               autocomplete="off">
        <button id="startBtn" class="main-btn">شروع بازی 🎮</button>
    </div>
</section>
<section id="gameScreen" class="screen game-screen hidden">
    <header class="game-header">
        <button id="prevBtn" class="nav-btn">◀ قبلی</button>
        <div class="stage-info">
            <div id="stageTitle">مرحله ۱</div>
            <div id="progressText">مرحله ۱ از ۷</div>
        </div>
        <button id="nextBtn" class="nav-btn">بعدی ▶</button>
    </header>
    <main class="game-content">
        <div id="instruction" class="instruction"></div>
        <div id="taskArea" class="task-area"></div>
        <div id="paletteArea" class="palette-area"></div>
        <div class="action-buttons">
            <button id="clearBtn" class="secondary-btn">پاک کردن</button>
            <button id="checkBtn" class="check-btn">بررسی پاسخ ✓</button>
        </div>
        <div id="feedback" class="feedback" aria-live="polite"></div>
    </main>
    <footer class="game-footer">
        <img src="34A60F59-B219-495E-B6FA-E03A85E81C3B.png"
             alt="امضای آموزگار"
             class="signature">
        <div>آموزگار: مرضیه محمدی</div>
    </footer>
</section>
<section id="finishScreen" class="screen finish-screen hidden">
    <div class="finish-card">
        <div class="big-star">⭐</div>
        <h1>آفرین قهرمان الگوها! 🎉</h1>
        <p id="finishMessage"></p>
        <div class="firework-static">🎆 ✨ 🎇 ✨ 🎆</div>
        <button id="restartBtn" class="main-btn">دوباره بازی کنیم 🔄</button>
        <img src="34A60F59-B219-495E-B6FA-E03A85E81C3B.png"
             alt="امضای آموزگار"
             class="signature finish-signature">
        <div>آموزگار: مرضیه محمدی</div>
    </div>
</section>
<div id="celebrationLayer"></div>
</div>
<script src="script.js"></script>
</body>
</html>
