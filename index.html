<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#e9dcff">
  <title>الگوی منظم | ریاضی پایه اول</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">

  <section id="welcome" class="screen welcome">
    <div class="welcome-card">
      <img class="teacher-photo" src="IMG_4332.jpeg" alt="عکس آموزگار"
           onerror="this.style.display='none'">
      <div class="welcome-title">الگوی منظم</div>
      <div class="welcome-subtitle">بازی ریاضی پایهٔ اول</div>
      <p class="welcome-message">بچه‌های گلم، با دقت به الگو نگاه کن و آن را ادامه بده.</p>

      <label for="studentName">نام دانش‌آموز:</label>
      <input id="studentName" type="text" maxlength="35"
             placeholder="نامت را اینجا بنویس" autocomplete="off">

      <button id="startButton" class="primary-button" type="button">
        شروع بازی 🚀
      </button>
    </div>
  </section>

  <section id="game" class="screen game-screen hidden">
    <header class="game-header">
      <div class="game-brand">
        <span class="brand-icon">🌈</span>
        <div>
          <strong>الگوی منظم</strong>
          <small id="studentGreeting">آماده‌ای؟</small>
        </div>
      </div>
      <div class="stage-counter" id="stageCounter">۱ از ۱۳</div>
    </header>

    <div class="progress-track">
      <div id="progressBar"></div>
    </div>

    <section class="question-area">
      <h1 id="questionTitle">الگو را ادامه بده</h1>
      <p id="questionText"></p>
    </section>

    <section class="palette-panel">
      <div id="palette" class="palette"></div>

      <div class="tool-buttons">
        <button id="pencilButton" class="tool-button" type="button"
                aria-pressed="false">✏️ مداد</button>
        <button id="eraserButton" class="tool-button" type="button"
                aria-pressed="false">🧽 پاک‌کن</button>
        <button id="clearButton" class="tool-button" type="button">
          پاک‌کردن پاسخ‌ها
        </button>
      </div>
    </section>

    <section id="boardArea" class="board-area">
      <div id="boardLabel" class="board-label">
        نام دانش‌آموز: الگو را ادامه بده
      </div>

      <div class="board-wrap">
        <div id="mainBoard" class="board"></div>
      </div>

      <div id="copyLabel" class="board-label copy-label">
        یک بار الگوی رئیس را تکرار کن
      </div>

      <div class="board-wrap">
        <div id="copyBoard" class="board copy-board"></div>
      </div>
    </section>

    <div id="feedback" class="feedback" aria-live="polite"></div>

    <div class="nav-buttons">
      <button id="prevButton" class="nav-button" type="button">مرحله قبل</button>
      <button id="checkButton" class="primary-button" type="button">بررسی پاسخ</button>
      <button id="nextButton" class="nav-button" type="button">مرحله بعدی</button>
      <button id="exitButton" class="nav-button exit-button" type="button">خروج</button>
    </div>

    <footer class="game-footer">
      <img class="signature"
           src="34A60F59-B219-495E-B6FA-E03A85E81C3B.png"
           alt="امضای آموزگار"
           onerror="this.style.display='none'">
      <div>آموزگار: مرضیه محمدی | مدرسه دخترانه شریعتی</div>
    </footer>
  </section>

  <section id="finish" class="screen finish-screen hidden">
    <div class="finish-card">
      <div class="finish-star">🌟</div>
      <h1>آفرین قهرمان!</h1>
      <p id="finishMessage"></p>
      <img class="signature finish-signature"
           src="34A60F59-B219-495E-B6FA-E03A85E81C3B.png"
           alt="امضای آموزگار"
           onerror="this.style.display='none'">
      <button id="restartButton" class="primary-button" type="button">
        شروع دوباره
      </button>
    </div>
  </section>

</main>

<div id="dragMouse" class="drag-mouse hidden" aria-hidden="true">🐭</div>
<canvas id="fireworksCanvas" class="fireworks-canvas" aria-hidden="true"></canvas>

<script src="script.js"></script>
</body>
</html>
