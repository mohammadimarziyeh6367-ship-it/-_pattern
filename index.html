<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بازی الگوی منظم</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="topbar">
            <h1>🎨 بازی الگوی منظم</h1>
            <div id="stageLabel">مرحله ۱ از ۷</div>
        </header>

        <section id="welcome" class="panel welcome">
            <h2>به بازی الگوها خوش آمدی!</h2>

            <p>
                نامت را بنویس و آماده شو.
            </p>

            <input
                id="studentName"
                type="text"
                placeholder="نام دانش‌آموز"
            >

            <button id="startButton">
                شروع بازی 🚀
            </button>
        </section>

        <section id="game" class="hidden">

            <div class="stage-heading panel">
                <h2 id="stageTitle">تمرین ۱</h2>

                <p id="stageInstruction">
                    الگو را بلند بخوان و سپس ادامه بده.
                </p>
            </div>

            <div class="work-area">

                <section class="panel board-card">
                    <h3>👀 به الگو نگاه کن</h3>
                    <div id="modelBoard" class="grid-board"></div>
                </section>

                <section class="panel board-card">
                    <h3>✏️ حالا ادامه بده</h3>

                    <div class="drawing-wrap">
                        <canvas id="drawingCanvas"></canvas>
                    </div>
                </section>

            </div>

            <section class="panel bottom-practice">
                <h3>الگو را بلند بخوان و سپس ادامه بده</h3>

                <div class="drawing-wrap">
                    <canvas id="finalCanvas"></canvas>
                </div>
            </section>

            <div class="controls">
                <button id="prevButton">مرحلهٔ قبل</button>
                <button id="clearButton">پاک کردن</button>
                <button id="checkButton">بررسی پاسخ ✓</button>
                <button id="nextButton">مرحلهٔ بعد</button>
            </div>

            <p id="feedback"></p>

        </section>

        <section id="finish" class="panel welcome hidden">
            <h2>🏆 آفرین!</h2>
            <p id="finishMessage">
                تمرین‌ها را به پایان رساندی.
            </p>

            <button id="restartButton">
                شروع دوباره
            </button>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
