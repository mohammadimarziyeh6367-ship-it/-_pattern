<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#e9dcff">
  <title>الگوی منظم | ریاضی پایه اول</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<main id="app">

  <!-- صفحه شروع -->
  <section id="welcome" class="screen welcome">
    <div class="welcome-card">

      <img
        class="teacher-photo"
        src="IMG_4332.jpeg"
        alt="عکس آموزگار"
        onerror="this.style.display='none'"
      >

      <h1 class="welcome-title">الگوی منظم</h1>
      <div class="welcome-subtitle">بازی ریاضی پایهٔ اول</div>

      <p class="welcome-message">
        بچه‌های گلم، الگوخوانی خیلی مهم است.
        پس اول الگو را بخوانید.
      </p>

      <label for="studentName">نام دانش‌آموز:</label>

      <input
        id="studentName"
        type="text"
        maxlength="35"
        placeholder="نامت را اینجا بنویس"
        autocomplete="off"
      >

      <button id="startButton" class="primary-button" type="button">
        شروع بازی 🚀
      </button>

    </div>
  </section>


  <!-- صفحه بازی -->
  <section id="game" class="screen game-screen hidden">

    <header class="game-header">
      <div class="game-brand">
        <span class="brand-icon">🌈</span>
        <div>
          <strong>الگوی منظم</strong>
          <small id="studentGreeting">آفرین، آماده‌ای؟</small>
        </div>
      </div>

      <div class="stage-counter" id="stageCounter">۱ از ۵</div>
    </header>

    <div class="progress-track">
      <div id="progressBar"></div>
    </div>

    <section class="question-area">
      <h1 id="questionTitle">الگو را ادامه بده</h1>
      <p id="questionText"></p>
    </section>

    <!-- ابزارهای انتخاب -->
    <div id="palette" class="palette"></div>

    <div class="tool-hint">
      اول رنگ یا شکل را انتخاب کن، بعد خانهٔ جدول را لمس کن.
    </div>

    <!-- دکمه‌های حرکت و ابزار پاک‌کن -->
    <div class="nav-buttons">

      <button id="prevButton" class="nav-button" type="button">
        قبلی
      </button>

      <button id="checkButton" class="primary-button" type="button">
        بررسی پاسخ
      </button>

      <button id="nextButton" class="nav-button" type="button">
        بعدی
      </button>

      <button
        id="eraserButton"
        class="nav-button eraser-nav-button"
        type="button"
        aria-pressed="false"
      >
        🧽 پاک‌کن
      </button>

      <button id="exitButton" class="nav-button exit-button" type="button">
        خروج
      </button>

    </div>

    <!-- جدول‌ها -->
    <section id="boardArea" class="board-area">

      <div id="boardLabel" class="board-label">
        الگوی اصلی
      </div>

      <div id="mainBoard" class="board"></div>

      <div id="copyLabel" class="board-label copy-label hidden">
        الگو را اینجا تکرار کن
      </div>

      <div id="copyBoard" class="board copy-board hidden"></div>

    </section>

    <div id="feedback" class="feedback" aria-live="polite"></div>

    <!-- امضای آموزگار -->
    <footer class="game-footer">
      <img
        class="signature"
        src="34A60F59-B219-495E-B6FA-E03A85E81C3B.png"
        alt="امضای مرضیه محمدی"
        onerror="this.style.display='none'"
      >
    </footer>

  </section>


  <!-- صفحه پایان -->
  <section id="finish" class="screen finish-screen hidden">

    <div class="finish-card">

      <div class="finish-star">🌟</div>

      <h1 id="finishTitle">آفرین قهرمان!</h1>

      <p id="finishMessage">
        تو الگوها را با دقت پیدا کردی.
      </p>

      <div id="finalScore" class="final-score"></div>

      <img
        class="signature finish-signature"
        src="34A60F59-B219-495E-B6FA-E03A85E81C3B.png"
        alt="امضای مرضیه محمدی"
        onerror="this.style.display='none'"
      >

      <button id="restartButton" class="primary-button" type="button">
        دوباره بازی کنیم
      </button>

    </div>

  </section>

</main>

<canvas id="fireworks" class="fireworks-canvas"></canvas>
<div id="dragMouse" class="drag-mouse hidden" aria-hidden="true">🐭</div>

<script src="script.js"></script>
</body>
</html>
