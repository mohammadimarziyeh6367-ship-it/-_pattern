<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>الگویابی | ریاضی پایه اول</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       صفحه شروع
  ========================== -->

  <section id="startScreen" class="screen start-screen">

    <div class="start-card">

      <div class="teacher-frame">
        <img
          src="IMG_4332.jpeg"
          alt="آموزگار"
          class="teacher-photo"
        >
      </div>

      <div class="welcome-badge">
        ریاضی پایه اول 🧮
      </div>

      <h1>الگو یابی</h1>

      <div class="welcome-text">
        <strong> </strong>
        <br>
        الگوخوانی خیلی مهم است.  
        <br>
      ✨اول الگو را بخوانید، سپس ادامه دهید
      </div>

      <div class="name-box">

        <label for="studentName">
          نام زیبایت را وارد کن 🥰
        </label>

        <input
          id="studentName"
          type="text"
          maxlength="25"
          autocomplete="off"
          placeholder=نام زیبایت را بنویس🥰"
        >

      </div>

      <button
        id="startBtn"
        class="main-btn"
        type="button"
      >
        شروع بازی 🚀
      </button>

    </div>

  </section>


  <!-- =========================
       صفحه بازی
  ========================== -->

  <section
    id="gameScreen"
    class="screen game-screen hidden"
  >

    <header class="game-header">

      <button
        id="prevBtn"
        class="nav-btn"
        type="button"
      >
        ➜ مرحله قبل
      </button>

      <div class="stage-info">

        <div class="game-title">
        الگو یابی
        </div>

        <div id="stageCounter">
          مرحله ۱ از ۱۲
        </div>

      </div>

      <button
        id="nextBtn"
        class="nav-btn"
        type="button"
      >
        مرحله بعد ➜
      </button>

    </header>


    <main class="game-content">

      <div
        id="instruction"
        class="instruction"
      ></div>

      <div id="taskArea"></div>


      <!-- =========================
           جدول تکرار یک بار الگو
      ========================== -->

      <div
        id="repeatBox"
        class="repeat-box hidden"
      >

        <div class="repeat-title">
           👏🏻 حالا الگو را یک بار خودت تکرار کن
        </div>

        <div
          id="repeatArea"
          class="repeat-area"
        ></div>

      </div>


      <!-- =========================
           پالت
      ========================== -->

      <div
        id="paletteBox"
        class="palette-box"
      >

        <div class="palette-title">
          ابزار انتخاب
        </div>

        <div
          id="palette"
          class="palette"
        ></div>

      </div>


      <!-- =========================
           دکمه‌ها
      ========================== -->

      <div class="game-actions">

        <button
          id="checkBtn"
          class="check-btn"
          type="button"
        >
          بررسی پاسخ ✅❎
        </button>

        <button
          id="clearBtn"
          class="clear-btn"
          type="button"
        >
          پاک کردن پاسخ 🧹
        </button>

      </div>


      <div
        id="feedback"
        class="feedback"
      ></div>

    </main>


    <!-- امضای آموزگار -->

    <div class="signature-wrap game-signature">

      <img
        src="34A60F59-B219-495E-B6FA-E03A85E81C3B.png"
        alt="امضا"
        class="signature"
      >

    </div>

  </section>


  <!-- =========================
       صفحه پایان
  ========================== -->

  <section
    id="finishScreen"
    class="screen finish-screen hidden"
  >

    <div class="finish-card">

      <div class="finish-icon">
        🌟
      </div>

      <h1>
        آفرین!
      </h1>

      <div id="finishText"></div>

      <div
        id="finalScore"
        class="final-score"
      ></div>

      <button
        id="restartBtn"
        class="main-btn"
        type="button"
      >
        دوباره بازی کنیم 🔄
      </button>

      <div class="signature-wrap finish-signature">

        <img
          src="34A60F59-B219-495E-B6FA-E03A85E81C3B.png"
          alt="امضا"
          class="signature"
        >

      </div>

    </div>

  </section>


  <script src="script.js"></script>

</body>
</html>
