<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الگوی منظم | ریاضی پایه اول</title>
  <link rel="stylesheet"href="style.css">
</head>

<body>

<div id="startScreen" class="screen">
  <div class="card start-card">
    <h1>🌈 الگوی منظم</h1>
    <h2>ریاضی پایه اول دبستان</h2>

    <p class="welcome">به بازی الگوها خوش آمدی! 🌸</p>

    <input id="studentName" type="text" placeholder="نام زیبایت را وارد کن">

    <button id="startBtn" class="main-btn">شروع بازی 🚀</button>
  </div>
</div>


<div id="gameScreen" class="screen hidden">

  <div class="top-bar">
    <div id="stageText">مرحله ۱ از ۱۲</div>
    <div id="scoreText">امتیاز: ۰</div>
  </div>

  <div class="card game-card">

    <h1>الگوی منظم 🌈</h1>

    <p id="instruction" class="instruction">
      ابتدا الگو را پیدا کن و سپس ادامه بده.
    </p>

    <div id="mainArea"></div>

    <p class="repeat-title">
      الگوی تکرارشونده را فقط یک بار بنویس.
    </p>

    <div id="repeatArea"></div>

    <div id="palette" class="palette"></div>

    <button id="checkBtn" class="check-btn">بررسی پاسخ ✅</button>

    <button id="nextBtn" class="next-btn hidden">مرحله بعد ➜</button>

    <div id="message" class="message"></div>

    <img
      class="signature"
      src="34A60F59-B219-495E-B6FA-E03A85E81C3B.png"
      alt="امضای آموزگار"
    >

  </div>
</div>


<div id="finishScreen" class="screen hidden">
  <div class="card finish-card">

    <h1>🎉 آفرین!</h1>

    <p id="finalMessage"></p>

    <div id="finalScore"></div>

    <button id="restartBtn" class="main-btn">
      دوباره بازی کن 🔄
    </button>

  </div>
</div>

<div id="fireworks"></div>

<script src="script.js"></script>
</body>
</html>
