<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>الگوی منظم | ریاضی پایه اول</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="app">

  <!-- =====================================================
       صفحه شروع
       ===================================================== -->

  <section id="cover" class="screen active">

    <div class="cover-card">

      <div class="cover-top">

        <div class="teacher-photo-wrap">
          <img
            src="IMG_4332.jpeg"
            class="teacher-photo"
            alt="معلم"
          >
        </div>

        <div class="cover-title">

          <h1>
            الگوی منظم
          </h1>

          <p>
            بازی کشف و ساخت الگو
          </p>

        </div>

      </div>


      <div class="cover-pattern">

        <span class="mini-circle blue"></span>
        <span class="mini-circle yellow"></span>
        <span class="mini-circle blue"></span>
        <span class="mini-circle yellow"></span>

      </div>


      <!-- متن آموزشی -->

      <div class="intro-message">

        <strong>
          بچه‌های گلم 🌸
        </strong>

        <br>

        الگوخوانی خیلی مهم است.

        <br>

        پس اول الگو را بخوانید،
        بعد ادامه‌اش بدهید.

      </div>


      <!-- نام دانش‌آموز -->

      <div class="student-name-box">

        <label for="studentName">
          نام زیبایت را وارد کن
        </label>

        <input
          id="studentName"
          type="text"
          maxlength="25"
          autocomplete="off"
          placeholder="نام من..."
        >

      </div>


      <button
        id="startBtn"
        class="primary-btn"
      >
        شروع بازی 🌟
      </button>

    </div>

  </section>



  <!-- =====================================================
       صفحه بازی
       ===================================================== -->

  <section id="game" class="screen">

    <header class="game-header">

      <div
        id="levelLabel"
        class="level-label"
      >
        مرحله ۱ از ۱۲
      </div>

      <div
        id="scoreLabel"
        class="score-label"
      >
        امتیاز: ۰
      </div>

    </header>


    <div class="progress-box">

      <div
        id="progressBar"
        class="progress-bar"
      ></div>

    </div>


    <div class="question-card">

      <div
        id="typeBadge"
        class="type-badge"
      >
        الگو
      </div>

      <h2 id="questionText">
        الگو را با دقت نگاه کن.
      </h2>

      <p id="instruction">
        الگو را بخوان و ادامه بده.
      </p>


      <div
        id="patternArea"
        class="pattern-area"
      ></div>


      <div
        id="choicesTitle"
        class="choices-title hidden"
      >
        یکی را انتخاب کن
      </div>


      <div
        id="choices"
        class="choices"
      ></div>


      <div
        id="feedback"
        class="feedback"
      ></div>

    </div>


    <!-- امضا -->

    <div class="signature-box">

      <img
        class="small-signature"
        src="34A60F59-B219-495E-B6FA-E03A85E81C3B.png"
        alt="امضا"
      >

    </div>


    <!-- کنترل‌ها -->

    <div class="game-controls">

      <button
        id="exitBtn"
        class="secondary-btn"
      >
        خروج
      </button>

      <button
        id="prevBtn"
        class="secondary-btn"
      >
        قبلی
      </button>

      <button
        id="nextBtn"
        class="primary-btn small"
      >
        بعدی
      </button>

    </div>

  </section>



  <!-- =====================================================
       پایان
       ===================================================== -->

  <section id="finish" class="screen">

    <div class="finish-card">

      <div class="finish-emoji">
        🎉
      </div>

      <h1>
        آفرین!
      </h1>

      <p id="finishMessage">
        تو یک قهرمان الگوها هستی.
      </p>

      <div
        id="finalScore"
        class="final-score"
      >
        امتیاز: ۰
      </div>

      <button
        id="restartBtn"
        class="primary-btn"
      >
        دوباره بازی می‌کنم
      </button>

    </div>

  </section>

</main>


<script src="script.js"></script>

</body>
</html>
